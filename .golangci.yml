version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - bodyclose
    - errorlint
    - unconvert
    - gocritic
    - revive
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      disabled-checks:
        - hugeParam
        - ifElseChain
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: context-as-argument
        - name: unreachable-code
    staticcheck:
      checks: ["all", "-ST1000"]
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gocritic, revive]

formatters:
  enable:
    - gofmt
