version: "3"

vars:
  BIN: bin/postctl
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: Build, test and lint
    cmds:
      - task: build
      - task: test
      - task: lint

  build:
    desc: Build ./bin/postctl (version embedded via -X main.version)
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/postctl
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  agents:check:
    desc: Full definition-of-done gate (build, race tests, lint); run before every merge
    cmds:
      - go build ./...
      - go test -race ./...
      - golangci-lint run --allow-parallel-runners

  keys:
    desc: Regenerate docs/keys.md from the key catalog in cmd/genkeys
    cmds:
      - go generate ./cmd/genkeys

  tui:smoke:
    desc: Drive the built TUI through a pty with the fake sender (offline, no network)
    deps: [build]
    cmds:
      - python3 scripts/tui_smoke.py {{.BIN}}

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -s -w .
      - golangci-lint fmt

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  assets:
    desc: Rebuild the embedded JavaScript bundles (needs node and npm)
    dir: internal/script/assets
    cmds:
      - npm ci
      - node build.js
    sources:
      - internal/script/assets/package-lock.json
      - internal/script/assets/build.js
    generates:
      - internal/script/assets/bundles/*.js
