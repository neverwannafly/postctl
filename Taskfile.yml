version: "3"

vars:
  BIN: bin/postctl
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: Build, test and lint
    cmds:
      - task: build
      - task: test
      - task: lint

  build:
    desc: Build ./bin/postctl (version embedded via -X main.version)
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/postctl
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -s -w .
      - golangci-lint fmt

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy
